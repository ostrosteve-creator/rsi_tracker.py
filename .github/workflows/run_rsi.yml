name: Run RSI Tracker

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        run: |
          python rsi_tracker.py
          echo "----- FILE LIST -----"
          ls -la
          echo "----- CSV CONTENT -----"
          cat rsi_output.csv

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: rsi-output
          path: rsi_output.csv
